Elle dicte les sizings."],["Tirage (draw)","Main incompl\xE8te qui peut devenir tr\xE8s forte : tirage couleur (9 outs), quinte par les deux bouts (8), quinte ventrale / gutshot (4), deux overcards (6)."],["Outs","Les cartes du paquet qui am\xE9liorent ta main. R\xE8gle du 4 et du 2 : outs \xD7 4 au flop, \xD7 2 \xE0 la turn \u2248 % de toucher."],["Semi-bluff","Bluffer avec un vrai tirage (\u2265 8 outs) \u2014 tu gagnes soit tout de suite, soit en touchant."],["Brelan / set","Trois cartes identiques ; \xAB set \xBB quand tu as la paire en main et la troisi\xE8me au board \u2014 tr\xE8s d\xE9guis\xE9, tr\xE8s payant."],["Top paire \xB7 kicker","La paire la plus haute possible avec le board ; le kicker est ta seconde carte, qui d\xE9partage deux paires \xE9gales."],["Value bet","Miser pour \xEAtre pay\xE9 par des mains moins bonnes que la tienne."],["Pot control","Checker avec une main moyenne pour garder le pot petit et arriver \xE0 l'abattage sans risquer ton tapis."]]],["Maths & concepts",[["\xC9quit\xE9","Ta probabilit\xE9 de gagner le pot \xE0 l'abattage. Ici, elle est simul\xE9e contre les ranges estim\xE9es de chaque adversaire (position \xB7 style \xB7 sizing)."],["Cote du pot \xB7 \xE9quit\xE9 requise","Ce que le pot t'offre par rapport \xE0 ce que tu dois payer. \xC9quit\xE9 requise = \xE0 payer \xF7 (pot + \xE0 payer)."],["Marge de cote","Ton \xE9quit\xE9 \u2212 l'\xE9quit\xE9 requise, en points. Positive : le call paye \xE0 la cote. Fiable postflop et sur les calls ~tapis."],["EV (esp\xE9rance)","Gain moyen d'une d\xE9cision sur le long terme. L'app l'affiche en jetons pour info : EV du call \u2248 \xE9quit\xE9 \xD7 (pot + \xE0 payer) \u2212 \xE0 payer."],["Cotes implicites","Les jetons que tu peux encore gagner sur les rues suivantes si tu touches \u2014 ce qui justifie certains calls limites (set-mining)."],["Fold equity","La part de la valeur d'une mise qui vient de la probabilit\xE9 que l'adversaire se couche."],["R\xE9alisation d'\xE9quit\xE9","La part de ton \xE9quit\xE9 brute que tu convertis vraiment en jetons. Hors de position ou avec une main domin\xE9e, tu en r\xE9alises moins \u2014 d'o\xF9 des folds corrects malgr\xE9 une marge positive."],["SPR (stack-to-pot ratio)","Tapis effectif \xF7 pot au flop. SPR bas (\u2264 3) : top paire suffit pour tout mettre. SPR haut (\u2265 8) : prudence, il faut du tr\xE8s lourd."],["GTO / exploitant","GTO : jeu \xE0 l'\xE9quilibre, inexploitable. Exploitant : d\xE9vier expr\xE8s pour punir les erreurs adverses. L'app enseigne une base solide + l'exploitation des profils."],["Range","L'ensemble des mains qu'un joueur peut avoir dans une situation donn\xE9e. On joue contre une range, jamais contre deux cartes pr\xE9cises."],["Chart","Tableau qui fixe l'action par main pour une confrontation (ex. HJ vs UTG) \u2014 celles de l'app viennent du pack Fazmil et de tes grilles YohViral."],["Tapis effectif","Le plus petit des deux tapis en jeu : c'est lui qui borne ce qu'on peut gagner ou perdre."],["Pot secondaire","Quand un joueur est \xE0 tapis, les mises au-del\xE0 de son tapis vont dans un pot s\xE9par\xE9 qu'il ne peut pas gagner."],["VPIP \xB7 PFR","VPIP : % de mains o\xF9 tu mets volontairement des jetons pr\xE9flop. PFR : % de mains que tu ouvres en relan\xE7ant. Un TAG tourne autour de 22 / 18."],["BB (unit\xE9)","Les tailles se comptent en grosses blinds : un open \xE0 2,5 BB, un tapis de 100 BB."],["Abattage (showdown)","La comparaison des mains restantes apr\xE8s la river \u2014 la meilleure main de 5 cartes gagne."]]],["Tournoi (MTT)",[["Ante","Mise forc\xE9e suppl\xE9mentaire (souvent pay\xE9e par la BB pour toute la table). Elle gonfle le pot pr\xE9flop : on se bat plus fort pour le voler."],["Zones de tapis","\u2265 40 BB : jeu profond normal. 20\u201340 : prudence sur les 3-bets. 10\u201320 : push/fold et re-steal. \u2264 10 : tapis ou fold, rien d'autre."],["Push/fold","Sous ~15 BB, ouvrir = partir \xE0 tapis ou jeter. Les tables Nash donnent la solution exacte par position, tapis et structure d'antes."],["Nash","Ranges de push/fold \xE0 l'\xE9quilibre : si les deux joueurs les suivent, personne ne peut mieux faire. La r\xE9f\xE9rence du jeu court."],["Shove / open-shove","Partir \xE0 tapis / ouvrir directement \xE0 tapis. \xAB Snap-call \xBB : payer instantan\xE9ment."],["Re-steal","3-bet (souvent \xE0 tapis) par-dessus un vol de blinds \xE9vident. Tr\xE8s rentable \xE0 12\u201320 BB contre les voleurs compulsifs."],["Bulle","Le moment juste avant les places pay\xE9es. La pression d'\xE9limination y est maximale \u2014 les tapis moyens se paralysent, les gros volent tout."],["ICM","Mod\xE8le qui convertit les jetons en valeur r\xE9elle (\u20AC) selon les paliers. Cons\xE9quence : les jetons que tu risques valent plus que ceux que tu peux gagner \u2192 calls plus serr\xE9s pr\xE8s des paliers."],["Palier (pay jump)","Saut de gains entre deux places pay\xE9es. Plus le saut est gros, plus l'ICM p\xE8se sur tes d\xE9cisions."],["Chip EV / \u20ACEV","Esp\xE9rance en jetons / en argent r\xE9el. Identiques en cash, diff\xE9rentes en tournoi \xE0 cause de l'ICM."]]],["Bankroll & mental",[["Bankroll","L'argent d\xE9di\xE9 au poker, s\xE9par\xE9 du reste. Rep\xE8res : \u2265 25 caves pour un niveau de cash, \u2265 50\u2013100 buy-ins en MTT."],["Variance","L'\xE9cart entre tes r\xE9sultats court terme et ton esp\xE9rance. \xC9norme au poker : on juge les d\xE9cisions, jamais les r\xE9sultats d'une session."],["Downswing","Longue p\xE9riode perdante malgr\xE9 du bon jeu. Statistiquement in\xE9vitable \u2014 la bankroll et le mental servent \xE0 la traverser."],["BB/100","Le winrate standard : grosses blinds gagn\xE9es pour 100 mains. Un bon r\xE9gulier en ligne tourne \xE0 3\u20138 BB/100."],["Rake","La commission pr\xE9lev\xE9e par la salle sur chaque pot. C'est l'adversaire invisible : il rend les petits pots moins rentables."],["Tilt","Jouer sous le coup de l'\xE9motion apr\xE8s un bad beat ou une erreur. Le premier destructeur de bankroll \u2014 la parade : pause imm\xE9diate."],["Biais de r\xE9sultat","Juger une d\xE9cision \xE0 son r\xE9sultat (\xAB j'ai perdu donc c'\xE9tait mauvais \xBB). Faux : un bon fold reste bon m\xEAme quand le tirage serait rentr\xE9."]]],["Profils de joueurs",[["TAG (serr\xE9-agressif)","Peu de mains, jou\xE9es fort. Le style de r\xE9f\xE9rence \u2014 et celui que l'app t'enseigne."],["LAG (large-agressif)","Beaucoup de mains, beaucoup d'agression. Dangereux mais exploitable : sur-relance ses bluffs."],["NIT (ultra serr\xE9)","Ne joue que le premium. Ses relances = du tr\xE8s fort ; en face, vole ses blinds sans piti\xE9."],["Calling station","Paye tout, ne fold presque jamais. Contre elle : value uniquement, jamais de bluff."],["Fish / reg","Fish : joueur faible et r\xE9cr\xE9atif. Reg (regular) : habitu\xE9 solide. Le profit vient surtout des fish \u2014 choisis tes tables."],["HUD","Heads-Up Display : les stats affich\xE9es sur chaque adversaire (VPIP/PFR/3-bet). L'app en simule un apr\xE8s 10 mains, comme un vrai tracker."],["Read","Information sur le style ou la main d'un adversaire, d\xE9duite de ses actions, ses sizings, son rythme \u2014 ou de ses stats."]]],["Dans l'app",[["XP & rangs","Chaque bonne d\xE9cision rapporte de l'XP (table \u2713 +8, charts +3, postflop +4, main du jour +25\u2026). 7 rangs de D\xE9butant \xE0 L\xE9gende, barre visible en haut."],["S\xE9rie \u{1F525} & jokers \u{1F9CA}","Jours d'entra\xEEnement cons\xE9cutifs (\u2265 20 XP/jour). Un jour rat\xE9 est couvert par un joker automatique \u2014 1 gagn\xE9 par semaine active, 2 max. Jalons : 3/7/14/30 j."],["Missions du jour","3 objectifs tir\xE9s au sort chaque jour (reset \xE0 minuit), avec XP \xE0 la cl\xE9. Visibles sur l'\xE9cran Quotidien."],["Main du jour","Un spot difficile, le m\xEAme pour toute la journ\xE9e, un seul essai \u2014 avec sa propre s\xE9rie et son historique 14 jours."],["Parcours du jour","L'encha\xEEnement guid\xE9 : Main du jour \u2192 10 charts \u2192 5 push/fold \u2192 5 mains de table (~10 min), +40 XP de bonus."],["R\xE9vision espac\xE9e (SRS)","Les spots rat\xE9s reviennent \xE0 intervalles croissants (charts et push/fold) jusqu'\xE0 \xEAtre acquis. Badge \xAB \u{1F501} r\xE9vision \xBB quand c'en est une."],["Retest imm\xE9diat","Une erreur en charts ou postflop revient 2 spots plus tard \u2014 la correction \xE0 chaud, avant la r\xE9vision espac\xE9e."],["Blitz & Survie","Blitz : 60 s, +2 s par bonne r\xE9ponse, record affich\xE9. Survie : une erreur et c'est fini. Dans l'Arcade."],["Boss","4 heads-up \xE0 th\xE8me (Nit de fer, Mme Station, Doc Pression, Le Professeur) : 20\u201325 mains, un plan de jeu \xE0 appliquer, badge \xE0 la victoire."],["Duel fant\xF4me","Tes sessions de 10 spots sont gard\xE9es ; 1\u20132 semaines plus tard, rejoue exactement les m\xEAmes mains et compare avec ton toi du pass\xE9."],["Coups m\xE9morables","Tes 10 plus gros pots, meilleurs bluffs et pires bad beats, sauvegard\xE9s et rejouables action par action (Progression), plus tes 20 derni\xE8res mains."],["HUD de l'app","Apr\xE8s 10 mains, VPIP/PFR/3-bet observ\xE9s s'affichent sous chaque IA \u2014 l'infobulle compare au profil type."],["Sources des charts","Pr\xE9flop : pack Fazmil (59 charts) et tes grilles YohViral. Push/fold : tes tables Nash \u2264 20 BB (4 structures d'antes)."]]]],yc={lente:{ai:1200,run:1200,auto:700},normale:{ai:750,run:850,auto:450},rapide:{ai:280,run:360,auto:200}},gh={blind:"bg-amber-50 border-amber-200 text-amber-700",check:"bg-stone-100 border-stone-300 text-stone-600",call:"bg-sky-50 border-sky-200 text-sky-700",raise:"bg-emerald-600 border-emerald-700 text-white",fold:"bg-rose-50 border-rose-200 text-rose-600",allin:"bg-stone-900 border-stone-900 text-white"};function kc({data:e,ev:t}){if(!e||e.length<2)return null;let n=260,r=40,s=t&&t.length>1?e.concat(t):e,o=Math.min(0,...s),l=Math.max(0,...s),u=Math.max(1,l-o),c=A=>A.map((b,x)=>`${x/(A.length-1)*n},${(r-(b-o)/u*r).toFixed(1)}`).join(" "),m= uit\xE9, chart), l'app v\xE9rifie et note tes r\xE9ponses.","Examen : aucun filet en direct, tout arrive dans l'analyse de fin de main \u2014 pour valider."]},{h:"Le principe n\xB01",ps:["Tu ne joues pas tes deux cartes contre deux cartes : tu joues une range (l'ensemble des mains possibles) contre une range. Toute la strat\xE9gie d\xE9coule de l\xE0."]}]},{id:"position",ic:"\u{1F9ED}",t:"La position",intro:"L'information est la ressource la plus pr\xE9cieuse \xE0 une table. Parler apr\xE8s l'adversaire, c'est d\xE9cider en sachant ce qu'il a fait.",blocks:[{h:"La carte des si\xE8ges",ps:["Dans l'ordre de parole pr\xE9flop : UTG (premier, le plus serr\xE9), UTG+1, UTG+2, Lojack, Hijack, Cutoff, Bouton (le meilleur si\xE8ge), puis les blinds SB et BB.","Postflop, le bouton parle toujours en dernier : information gratuite \xE0 chaque rue. Les blinds parlent en premier : elles jouent \xAB hors de position \xBB (OOP) tout le coup."]},{h:"Cons\xE9quence directe sur les ranges",ps:["Plus tu parles t\xF4t, plus il reste de joueurs derri\xE8re capables d'avoir une grosse main : ouvre serr\xE9 (~12 % en UTG). Plus tu parles tard, plus tu ouvres large (~40 % au bouton).","La m\xEAme main change de valeur selon le si\xE8ge : A9o est un fold en UTG et une ouverture standard au bouton."]},{h:"En position / hors de position",ps:["IP : tu peux contr\xF4ler la taille du pot, prendre des cartes gratuites, bluffer plus cr\xE9diblement. OOP : privil\xE9gie les mains qui se jouent toutes seules et les lignes simples.","Rep\xE8re : r\xE9alise ton \xE9quit\xE9. Hors de position avec une main moyenne, tu convertis moins de ton \xE9quit\xE9 brute en jetons \u2014 c'est pour \xE7a que des folds \xAB math\xE9matiquement limites \xBB sont corrects OOP."]}]},{id:"preflop",ic:"\u{1F0CF}",t:"Pr\xE9flop \u2014 cash game",intro:"En cash game profond (100 BB et plus), le pr\xE9flop se joue avec des ranges par position et des charts pour les confrontations.",blocks:[{h:"Raise or fold",ps:["Si tu entres dans un coup, entre en relan\xE7ant : 2,2\u20133 BB (+1 BB par limpeur). Limper te fait jouer un pot sans initiative ni fold equity.","L'app note tes ouvertures contre les ranges par position (~top 12 % UTG \u2192 ~40 % BTN) \u2014 consulte \u2660 Ranges pour les voir, et l'onglet \xAB Grilles YohViral \xBB pour tes grilles couleur du fichier projet."]},{h:"Face \xE0 une relance : les charts",ps:["Face \xE0 un open (et face \xE0 un 3-bet apr\xE8s ton open), l'app suit les charts du pack Fazmil : sur-relance value, sur-relance bluff, call ou fold selon ta position et celle de l'agresseur.","Les 3-bets bluff (A5s, KJo selon les spots\u2026) gardent de l'\xE9quit\xE9 quand on te paye et bloquent les mains premium adverses. Ne les tente que contre des joueurs capables de fold.","Entra\xEEne ces charts en rafale avec le drill \xAB Charts express \xBB : la r\xE9p\xE9tition espac\xE9e te ressert automatiquement tes erreurs."]},{h:"Sizing pr\xE9flop",ps:["Open : 2,5\u20133 BB. 3-bet : \u2248 3\xD7 l'open en position, \u2248 4\xD7 hors de position. 4-bet : \u2248 2,2\u20132,5\xD7 le 3-bet. Squeeze (open + suiveurs) : \u2248 4 BB + 1 BB par suiveur.","Un sizing trop gros ne fait continuer que les mains qui te battent ; trop petit, il offre la cote \xE0 toute la table. L'app signale les deux exc\xE8s."]},{h:"D\xE9fense de la grosse blind",ps:["En BB tu as d\xE9j\xE0 investi 1 BB et tu cl\xF4tures l'action : d\xE9fends nettement plus large que tu n'ouvrirais. 3-bet le haut, call les mains jouables (l'onglet Grilles YohViral montre tes grilles de d\xE9fense vs HJ/CO/BTN/SB).","Bataille de blindes : la SB attaque large (les ranges s'\xE9largissent \xE0 deux), la BB sur-d\xE9fend. C'est le spot le plus fr\xE9quent du poker \u2014 le drill \xAB D\xE9fense de BB \xBB le travaille en boucle."]},{h:"Set-mining (petites paires)",ps:["Avec 22\u2013TT face \xE0 une relance, payer pour chercher le brelan (~1 fois sur 8) est rentable si le tapis effectif fait au moins ~15\xD7 le montant \xE0 payer : c'est le prix des cotes implicites."]}]},{id:"postflop",ic:"\u{1F30A}",t:"Postflop",intro:"Trois questions \xE0 chaque rue : o\xF9 en est ma main, combien \xE7a co\xFBte de continuer, et qu'est-ce que ma mise accomplit ?",blocks:[{h:"Outs et la r\xE8gle du 4 et du 2",ps:["Les outs sont les cartes qui t'am\xE9liorent vraiment : tirage couleur 9, quinte par les deux bouts 8, deux overcards 6, quinte ventrale 4, paire \u2192 brelan 2.","\xC9quit\xE9 \u2248 outs \xD7 4 au flop (2 cartes \xE0 venir), outs \xD7 2 au turn. L'app te montre les cartes exactes, group\xE9es par combinaison."]},{h:"Cote du pot et marge",ps:["\xC9quit\xE9 requise = montant \xE0 payer \xF7 (pot + montant \xE0 payer). Exemple : payer 50 dans un pot de 100 \u2192 50/150 = 33 %.","Marge de cote = ton \xE9quit\xE9 \u2212 l'\xE9quit\xE9 requise. Positive : le call paye. L\xE9g\xE8rement n\xE9gative : seules de vraies cotes implicites (les jetons que tu gagneras si tu touches) le sauvent.","Ici l'\xE9quit\xE9 est simul\xE9e contre les ranges estim\xE9es de chaque adversaire (position, style, sizing) \u2014 c'est plus juste que \xAB contre deux cartes au hasard \xBB."]},{h:"Miser : toujours une raison",ps:["Value : \xEAtre pay\xE9 par moins bon (top paire bon kicker et mieux \u2192 mise, pas de slowplay multiway). Bluff : faire coucher meilleur (il faut une cible capable de fold). Semi-bluff : bluffer avec un vrai tirage (\u2265 8 outs) \u2014 tu gagnes tout de suite ou en touchant.","Rien touch\xE9 et pas de plan ? Check. Une main moyenne mise \xAB pour voir \xBB ne fait coucher que ce que tu battais et ne se fait payer que par ce qui te bat."]},{h:"Relancer face \xE0 une mise : trois raisons, trois noms",ps:["Quand tu relances une mise adverse, ce n'est jamais \xAB pour voir \xBB. Il y a exactement trois raisons, et savoir laquelle t'anime change la suite du coup.","1. La relance de VALUE : tu \xE9crases sa range, tu veux qu'il paie le plus possible. Deux paires sup\xE9rieures, brelan, quinte \u2014 mise gros, il te paiera avec ses top paires.","2. La relance de VALUE FINE (et de protection) : tu n'\xE9crases personne, mais tu es nettement au-dessus de la part \xE9quitable du pot avec une vraie main faite \u2014 top paire bon kicker, deux paires moyennes. Tu relances pour deux raisons \xE0 la fois : lui faire payer ses tirages, et prendre la main sur le d\xE9roul\xE9. Sois lucide : la range qui PAIE ta relance est plus forte que celle qui a mis\xE9. S'il te sur-relance, crois-le.","3. Le SEMI-BLUFF : tu n'as pas de main faite, mais un vrai tirage (8 outs et plus). Tu gagnes soit tout de suite parce qu'il se couche, soit plus tard en touchant. Sans tirage et sans main faite, ce n'est plus un semi-bluff : c'est un bluff sec, et il lui faut une cible capable de se coucher.","L'app nomme pr\xE9cis\xE9ment laquelle de ces trois relances tu viens de faire \u2014 c'est le vocabulaire qui structure la r\xE9flexion. Une main faite n'est jamais un bluff, et un tirage n'est jamais de la value."]},{h:"C-bet et textures de board",ps:["Dernier relanceur pr\xE9flop : mise en continuation fr\xE9quente sur les boards secs (A72, K83) qui favorisent ta range \u2014 33\u201350 % du pot suffit.","Boards humides (tirages possibles : 9\u26608\u26607\u2666) : mise plus grosse (66\u201375 %) avec tes bonnes mains, plus prudent avec le reste.","Une agression adverse soudaine au turn ou \xE0 la river = force r\xE9elle chez la grande majorit\xE9 des joueurs. Crois-la."]},{h:"\xAB J'ai la meilleure main, pourquoi checker ? \xBB \u2014 value ou pot control",ps:["Avoir la meilleure main \xE0 cet instant ne suffit pas \xE0 justifier une mise. La vraie question est : qui va payer ? Une mise est rentable quand des mains PIRES que la tienne peuvent la payer. Si seules les meilleures payent et que toutes les pires se couchent, tu ne gagnes rien quand tu es devant et tu perds gros quand tu es derri\xE8re : c'est le principe \xAB ni value, ni bluff \xBB.","Le crit\xE8re n'est donc pas ton pourcentage d'\xE9quit\xE9, c'est la force de ta main faite. Top paire bon kicker (kicker Q, K ou A), overpaire, deux paires, brelan : mise \u2014 il reste plein de mains plus faibles qui payent (top paire moins bonne, deuxi\xE8me paire, tirages). Deuxi\xE8me paire, top paire kicker faible, petite paire servie : checke \u2014 ces mains ne se font payer que par mieux.","Deuxi\xE8me crit\xE8re, la protection : sur un board avec des tirages, m\xEAme une main de value moyenne doit miser pour faire payer ceux qui te d\xE9passent gratuitement. Sur un board sec, ce risque dispara\xEEt et le check devient plus rentable.","Attention au pi\xE8ge multiway : \xE0 3 joueurs, ta part \xAB \xE9quitable \xBB du pot n'est que 33 % (25 % \xE0 4). 56 % d'\xE9quit\xE9 \xE0 trois, ce n'est pas \xAB juste au-dessus de la moyenne \xBB, c'est \xEAtre largement favori sur le terrain \u2014 donc une mise. \xC0 deux, 56 % serait beaucoup plus mince. L'app t'affiche cette part \xE9quitable dans son verdict."]},{h:"Pot control et SPR",ps:["Main moyenne : garde le pot petit, checke, va \xE0 l'abattage. Le ratio tapis/pot (SPR) guide l'engagement : SPR bas \u2192 top paire suffit pour tout mettre ; SPR haut \u2192 prudence sans main forte.","SPR = tapis effectif \xF7 pot, au moment o\xF9 le flop tombe. Les trois rep\xE8res \xE0 conna\xEEtre : SPR \u2264 3 \u2192 top paire suffit pour engager le tapis (tu n'auras pas la place de te coucher ensuite) \xB7 SPR 4 \xE0 6 \u2192 il faut top paire bon kicker ou mieux \xB7 SPR \u2265 7 \u2192 seules deux paires, un brelan ou un tr\xE8s gros tirage justifient de mettre beaucoup.","Le SPR se d\xE9cide AVANT le flop : plus tu relances gros pr\xE9flop, plus le SPR baisse, et plus une main moyenne devient jouable pour le tapis. C'est pour \xE7a qu'on ouvre plus gros avec une paire servie moyenne en tournoi court, et plus petit en cash deep. L'app affiche ton SPR dans l'aide en direct et dans l'analyse."]},{h:"Multiway : ce qui change \xE0 3 joueurs et plus",ps:["Ta part \xAB \xE9quitable \xBB du pot n'est plus 50 % mais 33 % \xE0 trois, 25 % \xE0 quatre. Une \xE9quit\xE9 de 45 % \xE0 trois joueurs fait de toi un gros favori sur le terrain \u2014 alors qu'\xE0 deux, ce serait une main perdante. L'app te rappelle cette part dans ses verdicts.","Les bluffs s'effondrent : il faut que TOUS se couchent. Si chacun continue une fois sur deux, ton bluff ne passe plus que 25 % du temps \xE0 trois. R\xE8gle : on bluffe beaucoup moins multiway, et on value-bet plus large.","Les mains marginales perdent aussi : plus il y a de joueurs, plus la probabilit\xE9 que l'un ait mieux monte. Top paire kicker faible, deuxi\xE8me paire \u2192 check et abattage. \xC0 l'inverse, les tirages et les mains qui font la nuts prennent de la valeur (les cotes implicites explosent).","Sizing : \xE0 trois, une mise de \u2153 suffit rarement \xE0 prot\xE9ger \u2014 passe \xE0 \u2154 avec tes vraies mains sur board mouill\xE9. Et m\xE9fie-toi du joueur qui paie derri\xE8re un autre payeur : il annonce presque toujours du vrai."]},{h:"Sizing pr\xE9flop : la r\xE8gle du +1 par limpeur",ps:["Ouverture standard : 2,5 \xE0 3 BB. Mais d\xE8s que des joueurs ont limp\xE9 avant toi, ajoute 1 BB par limpeur : 1 limpeur \u2192 4 BB, 2 limpeurs \u2192 5 BB, 3 limpeurs \u2192 6 BB.","Pourquoi : chaque limpeur a d\xE9j\xE0 de l'argent au milieu, donc le pot que tu attaques est plus gros et sa cote pour suivre est meilleure. Une ouverture \xE0 3 BB derri\xE8re deux limpeurs leur offre un prix imbattable \u2014 tu te retrouves \xE0 jouer un gros pot \xE0 quatre, sans initiative r\xE9elle. En montant \xE0 5 BB tu retrouves la possibilit\xE9 de jouer le coup \xE0 deux, en position.","Cette relance s'appelle une isolation : le but n'est pas de faire coucher tout le monde, c'est d'isoler le joueur faible qui a limp\xE9. Resserre un peu ta range depuis les positions pr\xE9coces, et \xE9largis-la au bouton contre des limpeurs passifs.","S'il y a un straddle (mise \xE0 l'aveugle de 2 BB), tout se compte en straddles : ouvrir \xAB \xE0 3 BB \xBB sur un pot straddl\xE9, c'est un min-raise. La bonne taille est 3 straddles, soit 6 BB, +1 straddle par limpeur.","L'app applique exactement cette r\xE8gle : le bouton \xAB Iso \xBB propose la taille juste, le conseil sous les boutons l'annonce, et l'analyse de fin de main te reprend si tu ouvres trop petit derri\xE8re des limpeurs."]},{h:"Sizing postflop",ps:["Value river : 60\u201375 % du pot (plus contre une calling station). Relance face \xE0 une mise : \u2248 3\xD7. Overbet (> pot) : r\xE9serv\xE9 aux tr\xE8s grosses mains et aux gros bluffs \u2014 jamais aux moyennes."]},{h:"Les lignes courantes (vocabulaire)",ps:["Check-raise : checker pour relancer derri\xE8re \u2014 l'arme de la BB, en value comme en semi-bluff. Donk bet : miser dans le relanceur avant qu'il parle \u2014 rarement bon, le check-raise fait mieux.","Barrel : encha\xEEner les mises sur plusieurs rues (double, triple). Probe : miser turn/river quand le relanceur a renonc\xE9 \xE0 son c-bet. Float : payer le flop l\xE9ger pour prendre le pot plus tard.","Polaris\xE9 (tr\xE8s fort ou bluff) contre merg\xE9 (continuum de mains moyennes-fortes) : les gros sizings vont avec les ranges polaris\xE9es, les petits avec les merg\xE9es."]},{h:"La river : value, bluff ou check",ps:["\xC0 la river il n'y a plus de tirages : ta main est soit une main d'abattage, soit un bluff. Mise tes mains fortes (value), bluffe tes pires mains (un check ne leur gagne jamais le pot), checke tout le milieu.","Choisis tes bluffs : bloqueurs des mains qui te paient, ligne coh\xE9rente, adversaire capable de fold \u2014 jamais contre une station.","Le drill postflop de l'app (onglet Postflop de l'\xE9cran Charts) t'entra\xEEne exactement l\xE0-dessus, \xE9quit\xE9 r\xE9elle \xE0 l'appui."]},{h:"L'EV affich\xE9e par l'app",ps:["Face \xE0 une mise, l'app compare d'abord ton \xE9quit\xE9 au pourcentage requis \u2014 c'est l'information principale. Puis elle traduit en jetons, pour info : EV du call \u2248 \xE9quit\xE9 \xD7 (pot + \xE0 payer) \u2212 \xE0 payer.","Positive : le call gagne des jetons en moyenne. N\xE9gative : il en br\xFBle. Sur un coup isol\xE9 tout peut arriver \u2014 l'EV parle du long terme, c'est elle qu'on optimise."]}]},{id:"calculs",ic:"\u{1F9EE}",t:"Les calculs \xE0 ton tour",intro:"Ce que tu calcules, dans l'ordre, \xE0 chaque fois que c'est \xE0 toi de parler face \xE0 une mise. Avec l'habitude : dix secondes, de t\xEAte.",blocks:[{h:"La checklist, toujours dans le m\xEAme ordre",ps:["1. Ma main peut-elle s'am\xE9liorer ? \u2192 je compte mes outs. 2. Outs \u2192 pourcentage de toucher (r\xE8gle du 4 et du 2). 3. Quel prix on me propose ? \u2192 \xE9quit\xE9 requise (cote du pot). 4. Je compare les deux nombres \u2192 call, fold, ou mieux : relance.","C'est exactement ce que l'app affiche en mode Aide (les trois tuiles), te demande en mode Quiz, et fait r\xE9p\xE9ter dans le drill \u{1F9EE} Calcul. L'objectif : que la checklist tourne toute seule dans ta t\xEAte."]},{h:"\xC9tape 1 \u2014 compter ses outs proprement",ps:["Un out = une carte encore invisible qui te donne (tr\xE8s probablement) la meilleure main. Les classiques : tirage couleur 9 \xB7 quinte par les deux bouts 8 \xB7 quinte ventrale (gutshot) 4 \xB7 paire servie \u2192 brelan 2 \xB7 deux overcards 6 (fragiles).","Les pi\xE8ges : ne compte pas deux fois la m\xEAme carte (le 5\u2665 qui compl\xE8te ta couleur ET ta quinte = un seul out) ; retire 1\u20132 outs \xAB sales \xBB quand la carte qui t'am\xE9liore peut donner mieux en face (elle compl\xE8te sa couleur, elle apparie le board) ; face \xE0 une grosse agression, les overcards valent presque z\xE9ro.","Exemple : 8\u26659\u2665 sur 6\u26657\u2660K\u2665 \u2014 9 c\u0153urs + 8 cartes de quinte (les quatre 5 et les quatre 10) \u2212 2 d\xE9j\xE0 compt\xE9es (5\u2665, 10\u2665) = 15 outs. Un monstre.","Cas limite : une carte qui am\xE9liore sans changer de cat\xE9gorie (deux paires 8-5 qui deviennent J-8) n'est PAS un out au sens de la r\xE8gle \u2014 elle n'aide que contre certaines mains pr\xE9cises. L'app te les affiche \xE0 part, en \xAB non compt\xE9es \xBB.","Le backdoor : 3 cartes d'une couleur au flop (ex. 8\u2660 en main, deux piques au board). Il faudrait le turn ET la river assortis : 10/47 \xD7 9/46 \u2248 4 %. Aucune carte seule ne te compl\xE8te, donc 0 out \u2014 surtout ne compte jamais les ~10 cartes restantes de la couleur, la r\xE8gle du 4 te donnerait ~40 % au lieu de 4 % ! Convention : +1 out au flop, rien \xE0 la turn. L'app te le signale par une ligne \xAB \u{1F313} Backdoor \xBB."]},{h:"\xC9tape 2 \u2014 des outs au pourcentage : la r\xE8gle du 4 et du 2",ps:["Au flop (2 cartes \xE0 venir) : outs \xD7 4 \u2248 % de toucher d'ici la river. \xC0 la turn (1 carte \xE0 venir) : outs \xD7 2.","9 outs au flop \u2248 36 % \xB7 \xE0 la turn \u2248 18 %. 15 outs au flop \u2248 60 % : tu es favori contre une top paire !","Pr\xE9cision : excellente jusqu'\xE0 ~10 outs (\xB1 2 points). Au-del\xE0 de 12 outs au flop, la r\xE8gle surestime un peu \u2014 retranche 2-3 points. Largement assez juste pour d\xE9cider."]},{h:"\xC9tape 3 \u2014 le prix : l'\xE9quit\xE9 requise",ps:["\xC9quit\xE9 requise = \xE0 payer \xF7 (pot au moment de payer + \xE0 payer). \xAB Pot au moment de payer \xBB = tout ce qui est au milieu, mise adverse comprise.","Le raccourci qui \xE9vite tout calcul : elle ne d\xE9pend que de la taille de mise en fraction du pot. \xC0 m\xE9moriser par c\u0153ur : mise \u2153 pot \u2192 20 % \xB7 \xBD pot \u2192 25 % \xB7 \u2154 pot \u2192 28 % \xB7 \xBE pot \u2192 30 % \xB7 pot entier \u2192 33 % \xB7 2\xD7 pot \u2192 40 %.","V\xE9rification sur un exemple : pot 100, il mise 66 (\u2154 pot). Pot au moment de payer = 166, \xE0 payer 66 \u2192 66 \xF7 232 \u2248 28 %. \u2713"]},{h:"\xC9tape 4 \u2014 comparer et d\xE9cider",ps:["Ton % de toucher \u2265 requis \u2192 le call est pay\xE9 par la cote du pot, tu peux suivre sereinement. Nettement en dessous \u2192 fold sans regret : chaque call br\xFBle des jetons en moyenne.","Cas particulier : quand l'adversaire est d\xE9j\xE0 \xE0 tapis, la troisi\xE8me option dispara\xEEt \u2014 pas de relance possible, pas de fold equity \xE0 gagner, et aucune cote implicite (il ne reste plus rien \xE0 miser). La cote du pot d\xE9cide seule : \xE9quit\xE9 \u2265 requis \u2192 call, sinon fold.","Zone limite (\xB1 2-3 points) : les cotes implicites d\xE9partagent \u2014 s'il reste beaucoup de jetons derri\xE8re et que ta main est d\xE9guis\xE9e (petite quinte, brelan cach\xE9), le call limite devient bon. Hors de position, arrondis plut\xF4t vers le fold (tu r\xE9aliseras moins ton \xE9quit\xE9).","Et n'oublie pas la troisi\xE8me option : relancer. L\xE0 ce n'est plus la cote qui d\xE9cide, c'est la fold equity \u2014 un gros tirage fait souvent un meilleur semi-bluff qu'un call passif."]},{h:"Les \xE9quit\xE9s pr\xE9flop \xE0 conna\xEEtre par c\u0153ur",ps:["Paire contre deux overcards (QQ vs AK) \u2248 55/45 \u2014 le fameux coin flip. Grosse paire contre petite paire (AA vs 88) \u2248 80/20. Domination (AK vs AQ) \u2248 70/30. AK contre paire moyenne \u2248 45/55.","Postflop : tirage couleur au flop contre top paire \u2248 35 % \xB7 tirage couleur + 2 overcards \u2248 54 % (favori !) \xB7 deux overcards s\xE8ches \u2248 25 %.","Ces cinq chiffres suffisent pour \xE9valuer 90 % des situations d'all-in."]},{h:"Exemple complet, en conditions r\xE9elles",ps:["Tu as 8\u26659\u2665, flop 6\u26657\u2660K\u2665. Le pot \xE9tait \xE0 100, l'adversaire mise 66. Checklist : outs = 15 (couleur 9 + quinte 8 \u2212 2 doublons). R\xE8gle du 4 : 15 \xD7 4 = 60 %. Requis : \u2154 pot \u2192 28 %. 60 \u2265 28 : call \xE9videmment pay\xE9\u2026","\u2026et comme tu es favori contre presque tout, la relance semi-bluff est encore meilleure : soit il fold (tu gagnes le pot tout de suite), soit tu touches 6 fois sur 10."]},{h:"O\xF9 s'entra\xEEner",ps:["Drill \u{1F9EE} Calcul (\xE9cran Charts, 3\u1D49 onglet, ou depuis l'Accueil) : la checklist compl\xE8te en 4 questions chiffr\xE9es par spot, correction \xE0 chaque \xE9tape, tol\xE9rance affich\xE9e.","Mode Quiz \xE0 la table : les m\xEAmes questions en situation r\xE9elle, not\xE9es dans ta Progression. Mode Aide : les tuiles font le calcul sous tes yeux \u2014 v\xE9rifie-toi avant de les regarder."]}]},{id:"profils",ic:"\u{1F465}",t:"Profils & exploitation",intro:"Le poker gagnant, c'est appliquer une base solide puis d\xE9vier exactement l\xE0 o\xF9 l'adversaire fait des erreurs.",blocks:[{h:"Les quatre profils de l'app",ps:["TAG (serr\xE9-agressif) : peu de mains, jou\xE9es fort \u2014 le style de r\xE9f\xE9rence, celui que l'app t'enseigne. Respecte son agression.","LAG (large-agressif) : pression constante, bluffe. Laisse-le se pendre : call down plus l\xE9ger, 3-bet ses opens trop larges.","Nit (ultra serr\xE9) : ses relances = du tr\xE8s fort, couche tes mains moyennes sans regret. En face, vole ses blinds sans rel\xE2che.","Calling station (large-passif) : paye tout, ne bluffe jamais. Contre elle : value-bet large et gros, z\xE9ro bluff \u2014 c'est la r\xE8gle la plus rentable du poker amateur."]},{h:"L'app s'adapte aussi \xE0 toi",ps:["Si tu folds trop souvent face aux relances pr\xE9flop, les IA le d\xE9tectent et t'attaquent plus large (bandeau \xAB les adversaires s'adaptent \xBB). Le rem\xE8de : d\xE9fendre davantage tes bonnes mains.","Le d\xE9tecteur de fuites classe tes erreurs par cat\xE9gorie et par position \u2014 l'\xE9cran Progression te montre o\xF9 partent tes points et lance le drill cibl\xE9."]},{h:"Lire une range : la grille 13\xD713",ps:["Une range, ce n'est pas \xAB il a peut-\xEAtre AK \xBB. C'est l'ensemble des mains qu'il peut avoir, vu sa position, son style et ce qu'il a mis\xE9. La grille 13\xD713 la montre d'un coup d'\u0153il : au-dessus de la diagonale les mains assorties, en dessous les d\xE9pareill\xE9es, sur la diagonale les paires servies.","Dans l'app, clique sur \xAB \u{1F441} son nom ~X % \xBB (aide en direct) ou sur \xAB \u{1F441} Voir sa range \xBB dans l'analyse de fin de main. Sur un flop, chaque case est color\xE9e par ce qui t'arrive contre elle : rouge = cette main te bat presque toujours, vert = tu la bats, orange = \xE7a d\xE9pend des combinaisons.","Ce qu'il faut y regarder : la TAILLE du bloc rouge, pas la pr\xE9sence d'une main qui te bat. Il aura toujours quelques monstres possibles ; la question est de savoir combien de ses combinaisons sont des monstres. Vingt combinaisons rouges sur cent, c'est un call facile. Quatre-vingts sur cent, c'est un fold.","Les combinaisons contenant tes cartes ou une carte du board disparaissent du compte : c'est l'effet bloqueur. Si tu tiens l'as de pique sur un board \xE0 trois piques, la couleur max lui est impossible \u2014 la grille l'a d\xE9j\xE0 retir\xE9 pour toi.","Et garde en t\xEAte ce que la grille ne sait pas : elle suppose un jeu coh\xE9rent. Un joueur qui bluffe beaucoup a une range plus large que celle affich\xE9e, un nit une range plus \xE9troite. Le HUD et l'\xE9tiquette de style sont l\xE0 pour corriger."]},{h:"Le HUD : confirmer tes reads avec des nombres",ps:["D\xE8s 10 mains jou\xE9es, l'app affiche VPIP/PFR/3-bet observ\xE9s sous chaque adversaire \u2014 exactement ce qu'un tracker montrerait en ligne.","Lis l'\xE9cart : 45/5 = paie tout, ne relance rien \u2192 station (value large, z\xE9ro bluff). 38/30 = agression permanente \u2192 LAG (pi\xE8ge tes monstres, call down plus large). 12/6 = nit (vole ses blinds, crois ses relances).","Le r\xE9flexe \xE0 construire : \xE9tiquette de style d'abord, nombres ensuite pour confirmer \u2014 puis l'exploitation qui va avec."]}]},{id:"mtt",ic:"\u{1F3C6}",t:"Tournoi (MTT)",intro:"En tournoi, les blinds montent, les tapis raccourcissent, l'\xE9limination est d\xE9finitive. La strat\xE9gie change avec la profondeur de ton tapis \u2014 compte-le toujours en BB.",blocks:[{h:"Structure : niveaux et antes",ps:["Les blinds augmentent par niveaux (ici : toutes les N mains selon le format). \xC0 partir du niveau 4, la BB poste aussi une ante (\xAB BB ante \xBB) \xE9gale \xE0 1 BB pour toute la table : le pot de d\xE9part grossit, voler les blinds rapporte beaucoup plus.","Pas de recave : tapis \xE0 z\xE9ro = \xE9limin\xE9. Le mode MTT de l'app simule ta table jusqu'au dernier survivant, comme une table finale."]},{h:"ICM : pourquoi un jeton gagn\xE9 vaut moins qu'un jeton perdu",ps:["En cash game, un jeton vaut un euro : doubler son tapis double sa valeur. En tournoi, non \u2014 les gains vont au classement. Doubler son tapis n'augmente pas ses gains attendus de 100 %, parce que la prime de la premi\xE8re place est plafonn\xE9e. Le mod\xE8le ICM traduit un tapis en esp\xE9rance d'argent.","Exemple \xE0 retenir : quatre joueurs, deux pay\xE9s (60 % / 40 %). Si tu as 250 jetons et les trois autres 50, tu d\xE9tiens 62,5 % des jetons\u2026 mais seulement 48 % du prizepool. Les 14 points de diff\xE9rence, ce sont les autres qui les r\xE9cup\xE8rent, simplement en survivant.","Cons\xE9quence pratique : pr\xE8s de la bulle, l'\xE9quit\xE9 requise pour payer un tapis monte de 5 \xE0 15 points au-dessus de la cote du pot. Un call \xAB juste rentable en jetons \xBB devient perdant en argent. Et plus il reste de joueurs plus courts que toi, plus tu dois te coucher \u2014 leur \xE9limination te rapporte gratuitement.","L'autre face : la pression ICM. Contre des adversaires eux-m\xEAmes coinc\xE9s par la bulle, tu peux voler beaucoup plus large \u2014 surtout en gros tapis contre des tapis moyens qui n'ont pas le droit de payer. Le drill \xAB ICM \u2014 la bulle \xBB (\xE9cran Charts, onglet Postflop) te fait sentir l'\xE9cart entre cote en jetons et cote ICM."]},{h:"Les zones de tapis (en BB)",ps:["Plus de 40 BB : joue proche du cash game \u2014 ranges par position, charts, postflop complet.","25\u201340 BB : resserre l\xE9g\xE8rement, \xE9vite les calls pr\xE9flop sp\xE9culatifs hors de position, les 3-bets deviennent plus engageants.","12\u201325 BB : zone de resteal \u2014 le 3-bet devient souvent un tapis direct ; plus de set-mining (les cotes implicites ont disparu).","20 BB et moins, premier de parole : push ou fold. C'est math\xE9matique, et c'est l\xE0 que l'app bascule automatiquement sur les tables Nash de ton fichier."]},{h:"Push/fold : les tables Nash",ps:["\xC0 tapis court, la fold equity d'un tapis direct + l'impossibilit\xE9 de jouer postflop rendent le push/fold optimal. Les tables Nash donnent, par position, structure d'antes et profondeur, la range exacte \xE0 pousser \u2014 inexploitables par l'adversaire.","Dans l'app : l'aide en direct, le quiz et l'analyse de fin de main utilisent ces tables d\xE8s que ton tapis passe sous ~20 BB en MTT ; les IA les jouent aussi. Entra\xEEne-les \xE0 vide dans le drill \xAB Tournoi \u2264 20 BB \xBB.","Avec les antes, les ranges de push s'\xE9largissent nettement (le pot \xE0 voler est plus gros) : compare \xAB Sans antes \xBB et \xAB Antes 12,5 % \xBB dans \u2660 Ranges \u2192 Nash."]},{h:"ICM : les jetons ne valent pas de l'argent",ps:["En tournoi, doubler ton tapis ne double pas ton esp\xE9rance de gain : les places pay\xE9es cr\xE9ent une valeur de survie. Pr\xE8s de la bulle ou d'un saut de prix, \xE9vite les flips marginaux \u2014 surtout contre les tapis qui te couvrent.","Corollaire : le gros tapis peut attaquer les moyens (qui doivent survivre), et le tr\xE8s court doit pousser avant d'\xEAtre mang\xE9 par les blinds. L'app ne calcule pas l'ICM, mais garde ce filtre en t\xEAte dans tes choix limites."]},{h:"R\xE9flexes propres au MTT",ps:["Compte tout en BB, pas en jetons. Regarde le tapis effectif avant chaque d\xE9cision.","Vole plus d\xE8s que les antes tombent ; d\xE9fends ta BB un peu moins \xAB \xE0 la cote pure \xBB quand payer t'engage pour ton tournoi.","Un min-raise \xE0 12 BB n'existe pas : c'est tapis ou fold. L'app te le rappellera."]}]},{id:"cashvsmtt",ic:"\u2696\uFE0F",t:"Cash vs MTT \u2014 les diff\xE9rences",intro:"M\xEAme jeu, objectifs diff\xE9rents : en cash tu maximises l'EV en jetons de chaque d\xE9cision ; en tournoi tu maximises ton esp\xE9rance de gain sur l'\xE9chelle des places.",blocks:[{h:"Le cadre",ps:["Recave : illimit\xE9e en cash (tapis reconstitu\xE9 \xE0 100 BB, chaque main est ind\xE9pendante) \xB7 impossible en MTT (l'\xE9limination est d\xE9finitive, chaque jeton perdu compte).","Blinds : fixes en cash (10/20 pour toujours) \xB7 croissantes en MTT, avec antes \u2014 l'inaction te ruine.","Profondeur : ~100 BB constants en cash \xB7 variable en MTT, de 150 BB au d\xE9part \xE0 10 BB sous pression : ta strat\xE9gie doit changer avec elle."]},{h:"Les ranges",ps:["Cash profond : charts compl\xE8tes, 3-bets avec calls derri\xE8re, set-mining rentable, gros jeu postflop.","MTT court : push/fold Nash, resteal \xE0 tapis, plus de set-mining ni de calls sp\xE9culatifs, le pr\xE9flop d\xE9cide presque tout.","Le vol de blinds : correct en cash, vital en MTT d\xE8s les antes \u2014 le pot de d\xE9part passe d'1,5 BB \xE0 ~2,5 BB."]},{h:"La valeur d'un jeton",ps:["Cash : 1 jeton = 1 jeton, l'EV en jetons est l'EV en argent. Un flip +2 % se prend toujours.","MTT : l'ICM d\xE9forme tout \u2014 perdre ton tapis co\xFBte plus que le gagner ne rapporte. Les flips marginaux se refusent pr\xE8s des paliers, la survie a un prix."]},{h:"Rythme, variance, mental",ps:["Cash : tu choisis quand partir, la variance est plus lisse, la discipline de s\xE9lection de mains fait le r\xE9sultat.","MTT : sessions longues, 80\u201385 % des tournois finissent sans gain m\xEAme pour les bons joueurs \u2014 la variance est brutale, les gros scores rares. Bankroll et mental doivent suivre (voir chapitre suivant)."]},{h:"Ce que l'app change entre les deux modes",ps:["Mode Cash : blinds fixes, recave auto, analyses par ranges/charts, drills BB \xB7 tirages \xB7 3-bet \xB7 charts express.","Mode Tournoi : \xE9chelle de blinds + ante BB, \xE9liminations et classement final, bascule automatique sur les tables Nash \u2264 20 BB (aide, quiz, analyse et IA), bilan de tournoi avec ta place."]}]},{id:"mental",ic:"\u{1F9E0}",t:"Bankroll & mental",intro:"La technique fait gagner les mains ; la gestion et le mental font gagner les ann\xE9es.",blocks:[{h:"Bankroll",ps:["Cash game : au moins 25\u201350 caves (buy-ins) de la limite jou\xE9e. Tu descends de limite quand la bankroll ne suit plus \u2014 sans ego.","MTT : 100 buy-ins et plus, la variance y est bien sup\xE9rieure. Les satellites et les fields \xE9normes en demandent encore davantage."]},{h:"Tilt et discipline",ps:["Un bad beat ne dit rien de ta d\xE9cision : juge le choix, pas le r\xE9sultat. L'analyse de fin de main de l'app est l\xE0 pour \xE7a.","Fatigue, frustration, revanche = arr\xEAt de session. Fixe des r\xE8gles avant de jouer (dur\xE9e, stop-loss) et respecte-les.","La s\xE9rie \u{1F525} quotidienne de l'app r\xE9compense la r\xE9gularit\xE9 : 15 bonnes d\xE9cisions par jour valent mieux qu'une session marathon hebdomadaire."]}]},{id:"app",ic:"\u{1F6E0}",t:"Bien utiliser l'app",intro:"Le mode d'emploi complet : le rituel quotidien, chaque \xE9cran, et tous les syst\xE8mes de progression.",blocks:[{h:"Le rituel quotidien (~10 min)",ps:["Ouvre l'\xE9cran Quotidien : la Main du jour (un seul essai, le m\xEAme spot difficile pour toute la journ\xE9e), 3 missions tir\xE9es au sort, et ta s\xE9rie \u{1F525}.","Le plus simple : lance le Parcours du jour \u2014 Main du jour \u2192 10 charts \u2192 5 push/fold \u2192 5 mains de table, +40 XP de bonus \xE0 la fin.","Ta s\xE9rie avance d\xE8s que tu gagnes 20 XP dans la journ\xE9e, o\xF9 que ce soit dans l'app. Un jour rat\xE9 est couvert automatiquement par un joker \u{1F9CA} (1 gagn\xE9 par semaine active, 2 max en r\xE9serve). Jalons et badges \xE0 3/7/14/30 jours."]},{h:"Les \xE9crans, un par un",ps:["Table : la partie (cash, tournoi, boss) en mode aide, quiz ou examen, avec l'analyse de chaque d\xE9cision. Quotidien : main du jour, missions, s\xE9rie et le bilan de ta semaine. Arcade : Blitz, Survie, Duel fant\xF4me et les 4 boss.","Charts : deux onglets \u2014 Pr\xE9flop (pack Fazmil, 59 charts, r\xE9vision espac\xE9e) et Postflop (c-bet, d\xE9fense de BB, river). 20 BB : le push/fold Nash de ton fichier. Progression : rang & XP, badges, courbe de gains, fuites, coups m\xE9morables, personnalisation.","Depuis la table, \u2660 Ranges ouvre tous les tableaux : charts Fazmil, tes grilles YohViral et les ranges Nash \u2014 avec ta main en surbrillance."]},{h:"Les drills, et quand les utiliser",ps:["Charts express : le r\xE9flexe pr\xE9flop pur, en rafale. Une erreur revient 2 spots plus tard (retest imm\xE9diat), puis en r\xE9vision espac\xE9e les jours suivants \u2014 laisse le syst\xE8me choisir quoi te remontrer.","Drill postflop : trois familles \u2014 c-bet au flop, BB face au c-bet, river value/bluff/check. L'\xE9quit\xE9 est calcul\xE9e pour de vrai contre la range adverse, et la correction explique la ligne.","Push/fold 20 BB : tables Nash avec r\xE9vision espac\xE9e des spots rat\xE9s. Drills de table (d\xE9fense de BB, cotes & tirages, pots 3-bet) : le m\xEAme spot en boucle jusqu'\xE0 l'ancrer.","S\xE9ance guid\xE9e (~15 min) : l'app choisit ta cible d'apr\xE8s tes fuites, 15 charts puis 8 mains. Examen blanc (20 mains) : mesure sans filet, score sur 100, historique dans Progression."]},{h:"XP, rangs, missions, badges",ps:["Chaque bonne d\xE9cision rapporte : table \u2713 +8 / \u26A0 +2, charts +3, push/fold +3, postflop +4, main du jour +25 et plus, missions +30 \xE0 +80, Arcade selon le score, tournois et boss en gros bonus.","7 rangs de D\xE9butant \xE0 L\xE9gende \u2014 la barre en haut montre ta progression vers le suivant. L'XP d\xE9bloque aussi 5 tapis et 5 dos de cartes (Progression \u2192 Personnalisation).","22 badges \xE0 collectionner, du simple (Premi\xE8re main) au l\xE9gendaire (100 charts sans faute, Comeback : gagner un MTT apr\xE8s \xEAtre tomb\xE9 sous 5 BB). Vitrine compl\xE8te dans Progression."]},{h:"L'Arcade",ps:["Blitz : 60 secondes, un max de spots, +2 s par bonne r\xE9ponse \u2014 records par mode. Survie : une seule erreur autoris\xE9e\u2026 c'est-\xE0-dire z\xE9ro.","Boss : 4 heads-up de 20\u201325 mains contre des caricatures (Le Nit de fer, Mme Station, Doc Pression, Le Professeur), \xE0 d\xE9bloquer dans l'ordre. Le plan de jeu est \xE9crit sur la carte du boss \u2014 l'appliquer EST l'exercice. Victoire = finir avec plus de jetons.","Duel fant\xF4me : tes sessions de 10 spots sont enregistr\xE9es ; une \xE0 deux semaines plus tard, rejoue exactement les m\xEAmes mains et compare-toi, spot par spot, \xE0 ton toi du pass\xE9. \xAB Nouveaux spots \xBB cr\xE9e un fant\xF4me frais."]},{h:"Lire tes adversaires : le HUD",ps:["Apr\xE8s 10 mains, trois nombres apparaissent sous chaque IA : VPIP / PFR / 3-bet \u2014 % de mains jou\xE9es, % relanc\xE9es pr\xE9flop, % de sur-relances. C'est ce qu'un vrai tracker afficherait.","Rep\xE8res (l'infobulle les rappelle) : TAG \u2248 22/18 \xB7 LAG \u2248 38/30 \xB7 nit \u2248 12/6 \xB7 station \u2248 45/5. Grand \xE9cart VPIP\u2212PFR = passif qui paie trop : value-bet large, z\xE9ro bluff.","Entra\xEEne-toi \xE0 lire l'\xE9tiquette de style d'abord, puis \xE0 la confirmer (ou l'infirmer) avec les nombres \u2014 c'est exactement le r\xE9flexe \xE0 avoir en ligne."]},{h:"Raccourcis clavier",ps:["Table : F fold \xB7 C check/call \xB7 R relance (montant du slider) \xB7 Entr\xE9e main suivante \u2014 y compris depuis l'analyse \xB7 A rouvrir l'analyse.","Charts : 1\u20134 pour r\xE9pondre \xB7 postflop : 1\u20133 \xB7 20 BB : 1/T tapis, 2/F fold \xB7 Entr\xE9e spot suivant partout \xB7 \xC9chap ferme toutes les fen\xEAtres."]},{h:"R\xE9glages utiles",ps:["\u{1F319} mode sombre et \u{1F50A} sons : en haut \xE0 droite. \xAB Ouvrir automatiquement l'analyse \xBB : d\xE9coche-la (pied de l'analyse ou r\xE9glages de table) pour encha\xEEner vite \u2014 la touche A la rouvre \xE0 la demande.","\u{1F3AF} \xAB Mains jouables \xBB (R\xE9glages de la table) : tu ne re\xE7ois que du top ~30 % \u2014 fini les poubelles \xE0 jeter, chaque main est une vraie d\xE9cision. Attention, la position compte toujours : A9o reste un fold UTG. Tes stats VPIP/PFR seront naturellement gonfl\xE9es dans ce mode.","\u{1F0CF} Jeu 4 couleurs (activ\xE9 par d\xE9faut) : \u2666 en bleu et \u2663 en vert, comme sur les salles en ligne \u2014 fini les tirages couleur fant\xF4mes entre piques et tr\xE8fles. D\xE9sactivable dans R\xE9glages de la table.","Tout est sauvegard\xE9 sur l'appareil. Exporte r\xE9guli\xE8rement le JSON depuis R\xE9glages : il contient stats, quiz, XP, badges, s\xE9rie et coups m\xE9morables \u2014 importable sur n'importe quel autre appareil."]}]},{id:"lexique",ic:"\u{1F4D6}",t:"Lexique",intro:"Tous les termes utilis\xE9s par l'app, class\xE9s par th\xE8me.",blocks:null}];function bh({initial:e,go:t,nav:n}){let[r,s]=(0,d.useState)(e||"start"),[o,l]=(0,d.useState)("");(0,d.useEffect)(()=>{e&&s(e)},[e]);let u=na.find(h=>h.id===r)||na[0],c=h=>(h||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""),m=(0,d.useMemo)(()=>{let h=c(o.trim());if(h.length<3)return null;let A=[];return na.forEach(b=>{(b.blocks||[]).forEach(x=>{(x.ps||[]).forEach(B=>{(c(x.h).includes(h)||c(B).includes(h))&&A.push({ch:b,h:x.h,txt:B})})})}),sa.forEach(([b,x])=>{x.forEach(([B,N])=>{(c(B).includes(h)||c(N).includes(h))&&A.push({ch:na.find(g=>g.id==="lexique"),h:`Lexique \xB7 ${b}`,txt:`${B} \u2014 ${N}`})})}),A.slice(0,40)},[o]),p=h=>{let A=c(o.trim()),b=c(h).indexOf(A);return b<0?h:d.default.createElement(d.default.Fragment,null,h.slice(0,b),d.default.createElement("mark",{className:"bg-amber-200 rounded px-0.5"},h.slice(b,b+A.length)),h.slice(b+A.length))};return d.default.createElement("div",{className:"min-h-screen text-stone-800 p-3 sm:p-6",style:tn.bg},d.default.createElement(xn,null),d.default.createElement("div",{className:"max-w
